services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: food_marketplace
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-init:
    image: food-marketplace-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "scripts/init-app-user.js"]
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      DB_NAME: food_marketplace
      APP_DB_USER: marketplace_app
      APP_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-local_app_password}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/food-marketplace-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: marketplace_app
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-local_app_password}
      DB_NAME: food_marketplace
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: food-marketplace-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
