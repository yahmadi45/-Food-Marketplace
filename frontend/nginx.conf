log_format marketplace_json escape=json
    '{"method":"$request_method","status":"$status","request_time":"$request_time","bytes_sent":"$bytes_sent"}';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout marketplace_json;
    access_log syslog:server=alloy:5514,tag=food_marketplace_frontend,severity=info marketplace_json;
    error_log /dev/stderr warn;
    error_log syslog:server=alloy:5514,tag=food_marketplace_frontend,severity=warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
