name: Food Marketplace CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: food-marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci_root_password_123456
      MYSQL_APP_PASSWORD: ci_app_password_123456
      JWT_SECRET: ci_only_secret_for_automated_tests_1234567890
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run backend tests
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Build and start services
        run: docker compose up -d --build --pull always

      - name: Check API readiness and frontend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/api/health/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:4000/api/health
          curl --fail --silent --show-error http://localhost:4000/api/health/ready
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/ >/dev/null

      - name: Show service status and logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color

      - name: Stop test environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-to-docker-hub:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.publishdockerhub == 'true' && vars.dockerhubuser != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.dockerhubuser }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.dockerhubuser }}/food-marketplace-backend:latest
            ${{ vars.dockerhubuser }}/food-marketplace-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.dockerhubuser }}/food-marketplace-frontend:latest
            ${{ vars.dockerhubuser }}/food-marketplace-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
