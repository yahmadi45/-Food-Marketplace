name: Food Marketplace CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start the application
        run: docker compose up -d --build --pull always

      - name: Check API and frontend
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:4000/api/health
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/ >/dev/null

      - name: Show service status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color

      - name: Stop test environment
        if: always()
        run: docker compose down --volumes --remove-orphans
