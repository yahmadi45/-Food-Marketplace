name: Food Marketplace CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: food-marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci_root_password_123456
      MYSQL_APP_PASSWORD: ci_app_password_123456
      JWT_SECRET: ci_only_secret_for_automated_tests_1234567890
      DEMO_USER_PASSWORD: ci_demo_password_only_123456
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Run backend tests
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Run frontend unit tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Build and start services
        run: docker compose up -d --build --pull always

      - name: Check API readiness and frontend
        run: |
          check_http() {
            url="$1"
            attempts=30
            while [ "$attempts" -gt 0 ]; do
              if curl --connect-timeout 3 --max-time 10 --fail --silent --show-error "$url"; then
                return 0
              fi
              attempts=$((attempts - 1))
              sleep 2
            done
            echo "HTTP check failed after retries: $url" >&2
            return 1
          }
          check_http http://localhost:4000/api/health
          check_http http://localhost:4000/api/health/ready
          check_http http://localhost:8080/api/health
          check_http http://localhost:8080/

      - name: Show service status and logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color

      - name: Stop test environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Add GITLEAKS_LICENSE from repository secrets if this moves to an organization.

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build images for scanning
        run: |
          docker build -t food-marketplace-backend:ci -f backend/Dockerfile backend
          docker build -t food-marketplace-frontend:ci -f frontend/Dockerfile frontend

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: food-marketplace-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: food-marketplace-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build images for SBOM generation
        run: |
          docker build -t food-marketplace-backend:ci -f backend/Dockerfile backend
          docker build -t food-marketplace-frontend:ci -f frontend/Dockerfile frontend

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: food-marketplace-backend:ci
          format: spdx-json
          output-file: backend-sbom.spdx.json
          artifact-name: backend-sbom

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: food-marketplace-frontend:ci
          format: spdx-json
          output-file: frontend-sbom.spdx.json
          artifact-name: frontend-sbom

  publish-to-docker-hub:
    needs: [test-and-build, gitleaks, trivy, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.publishdockerhub == 'true' && vars.dockerhubuser != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.dockerhubuser }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.dockerhubuser }}/food-marketplace-backend:latest
            ${{ vars.dockerhubuser }}/food-marketplace-backend:${{ github.sha }}
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.dockerhubuser }}/food-marketplace-frontend:latest
            ${{ vars.dockerhubuser }}/food-marketplace-frontend:${{ github.sha }}
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
